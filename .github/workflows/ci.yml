name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Run the tests, and fail if the runner found none
        # A suite that discovers its own files reports success when it finds
        # nothing, so the count is read rather than the exit code alone.
        run: |
          node --experimental-strip-types --test src/*.test.ts 2>&1 | tee result.txt
          passed=$(grep -E "^# pass |^ℹ pass " result.txt | grep -oE "[0-9]+" | head -1)
          echo "tests passed: ${passed:-0}"
          if [ "${passed:-0}" -lt 20 ]; then
            echo "Fewer tests ran than this repository has. The runner found almost nothing."
            exit 1
          fi

  terraform:
    name: Terraform is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra fmt -check -recursive
